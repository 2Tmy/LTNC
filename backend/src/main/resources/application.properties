# Application
spring.application.name=complaint-management
server.port=8080

# Data source
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
complaints.upload-dir=${COMPLAINTS_UPLOAD_DIR:uploads}

# JWT
jwt.secret=${JWT_SECRET:company-complaint-secret-key-must-be-at-least-256-bits-long}
jwt.expiration=${JWT_EXPIRATION:86400000}

# SpringDoc / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# Preserve persisted data during normal startup.
# Use --spring.profiles.active=seed only when an explicit local reset is needed.
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
